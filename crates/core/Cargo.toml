[package]
name = "wntui-core"
version.workspace = true
edition.workspace = true

[dependencies]
directories.workspace = true
futures-util = { version = "0.3.34", features = ["sink"] }
fuzzy-matcher = "0.3.7"
# zbus store: pure-Rust Secret Service client, no libdbus linking (keeps
# the binary runnable on NixOS without a nix-shell).
keyring = { version = "4", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
prost.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml.workspace = true
uuid.workspace = true
webpki-roots = "1"

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
pretty_assertions = "1"
